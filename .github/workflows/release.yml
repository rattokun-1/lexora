name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check && npm test && npm run build
      - run: cd dist && zip -r ../kotomia-${GITHUB_REF_NAME}.zip .
      - run: gh release create "$GITHUB_REF_NAME" "kotomia-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
