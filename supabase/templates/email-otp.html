<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>コトミア 確認コード</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f7f5ec;
      color: #203f3c;
      font-family: Arial, &quot;Noto Sans JP&quot;, sans-serif;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">
      コトミアの確認コードをお送りします。登録またはメールアドレス確認に使用してください。
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="480"
            cellspacing="0"
            cellpadding="0"
            style="
              width: 100%;
              max-width: 480px;
              background: #fffef9;
              border: 1px solid #dce4da;
              border-radius: 24px;
            "
          >
            <tr>
              <td style="padding: 32px 24px">
                <p style="margin: 0 0 32px; font-size: 22px; font-weight: bold; color: #176a5c">
                  ✦ コトミア
                  <span style="font-size: 11px; font-weight: normal; color: #62736d"
                    >英単語学習</span
                  >
                </p>
                <p style="margin: 0 0 10px; color: #926d2b; font-size: 11px; letter-spacing: 2px">
                  メールアドレスの確認
                </p>
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.5; color: #203f3c">
                  確認コードで確認する
                </h1>
                <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.9; color: #62736d">
                  アプリに戻って、次のコードを入力してください。メールアドレスの確認に使用します。
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td
                      align="center"
                      style="
                        padding: 24px 8px;
                        border: 1px solid #bdcfc3;
                        border-radius: 16px;
                        background: #e9f1eb;
                        color: #155747;
                        font-family: Consolas, monospace;
                        font-size: 30px;
                        font-weight: bold;
                        letter-spacing: 4px;
                        word-break: break-all;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
                <p style="margin: 18px 0 0; color: #62736d; font-size: 12px; line-height: 1.9">
                  このコードには有効期限があります。期限切れの場合は、アプリから再送信してください。<br />コードを他の人に教えないでください。
                </p>
                <div style="height: 1px; background: #dce4da; margin: 28px 0"></div>
                <p style="margin: 0; font-size: 11px; line-height: 1.9; color: #62736d">
                  このメールに心当たりがない場合は、何もせず破棄してください。
                </p>
                <p style="margin: 18px 0 0; font-size: 12px">
                  <a
                    href="https://tanq.dashcloudly.com/"
                    style="color: #176a5c; text-decoration: underline"
                    >コトミアを開く</a
                  >
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 20px 0 0; color: #62736d; font-size: 10px">
            コトミア · アカウント確認メール
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
